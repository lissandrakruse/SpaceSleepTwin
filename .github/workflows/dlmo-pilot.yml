name: Single-profile DLMO reproduction pilot
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/dlmo-pilot.yml'
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.3'
          use-public-rspm: true
      - name: Download and audit pinned licensed data
        run: python3 analysis/import_dlmo_reference.py --root data/dlmo_reference --output outputs/dlmo_reference/import_audit.json
      - name: Restore upstream article environment
        shell: Rscript {0}
        run: |
          install.packages("renv")
          renv::restore(lockfile = "data/dlmo_reference/renv.lock", prompt = FALSE)
      - name: Estimate one preliminary coarse profile
        env:
          DLMO_FINE: 'false'
          DLMO_PROFILE_LIMIT: '1'
        run: Rscript analysis/estimate_dlmo_reference.R data/dlmo_reference/data outputs/dlmo_reference
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dlmo-single-profile-pilot
          path: outputs/dlmo_reference
          if-no-files-found: error
